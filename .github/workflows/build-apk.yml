name: 打包 Android APK

# 说明：这个文件让 GitHub 的免费服务器帮你把 DDtodo 编译成手机上能装的 APK。
# 用法：进入仓库的 Actions 标签页，选左侧「打包 Android APK」，点 Run workflow。
#       跑完后在当次运行页面底部 Artifacts 里下载 DDtodo-apk.zip，
#       解压出来的 app-release.apk 就是安装包。

on:
  workflow_dispatch:      # 允许手动点击运行
  push:
    branches: [ main ]    # 往 main 分支推送代码时也自动跑一次

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 准备 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flutter 每个版本自带的 Android 工程模板都不同（Gradle / AGP / wrapper 等），
      # 所以先用当前 Flutter 生成一个干净工程，再把本仓库源码塞进去。
      - name: 生成标准 Android 工程壳
        run: flutter create --org com.example --project-name ddtodo "$RUNNER_TEMP/ddtodo"

      - name: 放入 DDtodo 的源码与配置
        run: |
          set -e
          W="$RUNNER_TEMP/ddtodo"
          cp pubspec.yaml "$W/pubspec.yaml"
          rm -rf "$W/lib"
          cp -r lib "$W/lib"
          rm -rf "$W/test"
          cp android/app/src/main/AndroidManifest.xml "$W/android/app/src/main/AndroidManifest.xml"
          mkdir -p "$W/android/app/src/debug" "$W/android/app/src/profile"
          cp android/app/src/debug/AndroidManifest.xml "$W/android/app/src/debug/AndroidManifest.xml"
          cp android/app/src/profile/AndroidManifest.xml "$W/android/app/src/profile/AndroidManifest.xml"
          echo "----- 放进去了这些文件 -----"
          ls -1 "$W/lib"

      - name: 下载依赖
        working-directory: ${{ runner.temp }}/ddtodo
        run: flutter pub get

      # 把所有 Dart 错误列到运行页面的 Annotations 面板上，一眼可见
      - name: 静态检查（列出所有 Dart 错误）
        working-directory: ${{ runner.temp }}/ddtodo
        continue-on-error: true
        run: |
          flutter analyze > analyze.txt 2>&1 || true
          echo "======== flutter analyze 的完整输出 ========"
          cat analyze.txt
          echo "======== 其中带 error 的行 ========"
          grep -i "error" analyze.txt | head -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "=========================================="

      - name: 编译 release APK
        working-directory: ${{ runner.temp }}/ddtodo
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: DDtodo-apk
          path: ${{ runner.temp }}/ddtodo/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
