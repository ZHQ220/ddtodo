name: 打包 Android APK

# 说明：
#   这个文件让 GitHub 的免费服务器帮你把 DDtodo 编译成手机上能装的 APK。
#   你不需要在电脑上安装 Flutter / Android Studio / Java。
#
# 用法：把整个项目传到 GitHub 仓库后，进入仓库的 Actions 标签页，
#       选择左侧的「打包 Android APK」，点右边的 Run workflow 即可。
#       跑完后在当次运行的页面底部 Artifacts 里下载 DDtodo-apk.zip，
#       解压出来的 app-release.apk 就是安装包。

on:
  workflow_dispatch:      # 允许手动点击运行
  push:
    branches: [ main ]    # 往 main 分支推送代码时也自动跑一次

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 准备 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Flutter 每个版本自带的 Android 工程模板都不同（Gradle / AGP 版本、
      # gradle wrapper 的 jar 等）。所以这里先用你当前 Flutter 版本生成一个
      # 干净的标准工程，再把本仓库的源码塞进去 —— 这样就不会出现
      # 「Gradle 版本和插件不匹配」这类问题。
      - name: 生成标准 Android 工程壳
        run: flutter create --org com.example --project-name ddtodo "$RUNNER_TEMP/ddtodo"

      - name: 放入 DDtodo 的源码与配置
        run: |
          set -e
          W="$RUNNER_TEMP/ddtodo"
          cp pubspec.yaml "$W/pubspec.yaml"
          rm -rf "$W/lib"
          cp -r lib "$W/lib"
          # 模板工程自带的 test/widget_test.dart 引用的是默认计数器示例，删掉
          rm -rf "$W/test"
          # 用本项目的 AndroidManifest.xml 覆盖模板的（加上日历读取权限、应用名 DDtodo）
          cp android/app/src/main/AndroidManifest.xml "$W/android/app/src/main/AndroidManifest.xml"
          mkdir -p "$W/android/app/src/debug" "$W/android/app/src/profile"
          cp android/app/src/debug/AndroidManifest.xml "$W/android/app/src/debug/AndroidManifest.xml"
          cp android/app/src/profile/AndroidManifest.xml "$W/android/app/src/profile/AndroidManifest.xml"
          echo "----- 放进去了这些文件 -----"
          ls -1 "$W/lib"

      - name: 下载依赖
        working-directory: ${{ runner.temp }}/ddtodo
        run: flutter pub get

      - name: 编译 release APK
        working-directory: ${{ runner.temp }}/ddtodo
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: DDtodo-apk
          path: ${{ runner.temp }}/ddtodo/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
