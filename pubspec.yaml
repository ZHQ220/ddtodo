name: dd_todo
description: "DDtodo —— 排班与待办清单（纯本地 SQLite，含农历、法定节假日角标与 JSON 备份）"
publish_to: 'none'
version: 1.0.0+1

environment:
  # 建议 Flutter 3.27+ / Dart 3.6+。若有更新的 SDK，pub 会自动选择更高版本的依赖。
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # 本地数据库
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # 轻量键值存储（用户偏好、上次选中的日期等）
  shared_preferences: ^2.3.2

  # 系统日历同步功能已整体删除（设置页入口、页面、服务代码全删）。
  # 原来用的 device_calendar 最后更新于 2024-09，与较新的 Flutter / Android
  # Gradle 插件不兼容，会让打包失败；而且这个功能确认不需要，所以不再引入。
  # 将来若要做导入，请自己实现并自行承担依赖风险，不要直接加回下面这行：
  # device_calendar: ^4.3.3

  # 从本机选择 JSON 备份文件
  file_picker: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
